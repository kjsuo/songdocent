name: Build Windows x64 portable app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-test.yml', 'src-tauri/**', 'package.json', 'pnpm-lock.yaml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build x64 portable executable
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --no-bundle
      - name: Prepare portable files
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item "$releaseDir/songdocent.exe" "portable/SongDocent.exe"
          Get-ChildItem $releaseDir -Filter *.dll | Copy-Item -Destination portable
          Copy-Item LICENSE portable
          Copy-Item NOTICE portable
          Copy-Item -Recurse public/licenses portable/licenses
          Copy-Item public/fonts/Geist-LICENSE.txt portable/Geist-LICENSE.txt
          Copy-Item public/provider-logos/LICENSE portable/Provider-Icons-LICENSE.txt
          "Extract this ZIP, then run SongDocent.exe. Microsoft Edge WebView2 Runtime is required. Settings and credentials use the Windows user profile." | Set-Content portable/README.txt
          Get-FileHash portable/SongDocent.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v7
        with:
          name: SongDocent-windows-x64-portable
          path: portable/
          if-no-files-found: error
          retention-days: 14
