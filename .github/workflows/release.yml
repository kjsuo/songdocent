name: Release SongDocent
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: songdocent-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: pnpm release:prepare
      - name: Build signed updater and installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target ${{ matrix.target }} --config src-tauri/tauri.updater.generated.conf.json
      - run: node scripts/release.mjs collect ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/release.mjs manifest
      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true || { echo "Published tags cannot be reused."; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "SongDocent $GITHUB_REF_NAME" --generate-notes
          fi
          mapfile -d '' assets < <(find release-artifacts -type f ! -name platform.json -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Publish after every platform asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
